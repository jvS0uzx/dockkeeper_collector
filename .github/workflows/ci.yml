name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: actions fixadas e downloads conferidos
        run: .github/scripts/confere-ci-fixado.sh

      - name: gitleaks
        env:
          VERSAO: 8.18.4
          SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner --log-opts=--all
          ./gitleaks detect --redact --no-banner --no-git

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "gofmt pendente em:"; echo "$arquivos"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 -race ./...

      - name: versão injetada por ldflags
        run: |
          go build -ldflags "-X main.Version=0.0.0-ci" -o coletor ./cmd/collector
          test "$(./coletor --version)" = "0.0.0-ci"
